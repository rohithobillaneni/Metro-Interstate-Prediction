name: Offline evaluation

on:
  push:
    branches: [main, fix/reproducible-temporal-evaluation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install locked test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-serving.txt -r requirements-frontend.txt
      - name: Behavioural tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce raw-data evaluation
        run: python -m src.evaluation --data data/Metro_Interstate_Traffic_Volume.csv --output validation-result.json
      - name: Check fixed dataset and cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('validation-result.json').read_text())
          reference = json.loads(Path('benchmarks/validation-2017.json').read_text())
          for key in ('source_sha256', 'cleaning', 'split', 'model_parameters', 'weekday_hour_fallback_count'):
              assert actual[key] == reference[key], key
          assert set(actual['metrics']) == set(reference['metrics'])
          # Floating-point digests/metrics need not be identical across platforms.
          PY
      - name: Reproduce fixed temporal development windows
        run: python -m src.temporal_evaluation --data data/Metro_Interstate_Traffic_Volume.csv --output temporal-result.json
      - name: Check temporal protocol and cohorts
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          actual = json.loads(Path('temporal-result.json').read_text())
          reference = json.loads(Path('benchmarks/temporal-development-2017.json').read_text())
          for key in ('protocol', 'protocol_sha256', 'source_sha256', 'evaluation_lock_sha256', 'cleaning', 'pooled_count'):
              assert actual[key] == reference[key], key
          # Historical report hashes identify its historical implementation.
          # Check current provenance against current files, not old code bytes.
          import hashlib
          for path, digest in actual['source_code_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          assert len(actual['folds']) == len(reference['folds']) == 4
          for fold, expected in zip(actual['folds'], reference['folds']):
              for key in ('validation_start', 'validation_end', 'train', 'validation', 'coverage', 'baselines'):
                  assert fold[key] == expected[key], key
              assert [(r['date_time'], r['actual']) for r in fold['predictions']] == [(r['date_time'], r['actual']) for r in expected['predictions']]
          # Tests recompute pooled/paired metrics from predictions. Floating-point
          # predictions/metrics need not be identical across platforms.
          PYCODE
      - name: Reproduce full-year paired weather-row sensitivity
        run: python -m src.weather_sensitivity --data data/Metro_Interstate_Traffic_Volume.csv --output weather-result.json
      - name: Check sensitivity protocol and identical cohorts
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          actual = json.loads(Path('weather-result.json').read_text())
          reference = json.loads(Path('benchmarks/weather-sensitivity-2017.json').read_text())
          for key in ('protocol', 'protocol_sha256', 'protocol_file_sha256', 'source_sha256', 'evaluation_lock_sha256', 'cleaning', 'feature_changes'):
              assert actual[key] == reference[key], key
          # Preserve historical implementation hashes in the reference report.
          # Require the same source coverage, with hashes of the current files.
          import hashlib
          assert set(actual['source_code_sha256']) == set(reference['source_code_sha256'])
          for path, digest in actual['source_code_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          for name in ('first', 'last'):
              policy, expected = actual['policies'][name], reference['policies'][name]
              assert policy['coverage'] == expected['coverage']
              assert policy['pooled']['count'] == expected['pooled']['count']
              assert len(policy['folds']) == len(expected['folds']) == 53
              for quarter in ('Q1', 'Q2', 'Q3', 'Q4'):
                  assert policy['quarters'][quarter]['count'] == expected['quarters'][quarter]['count']
              for fold, prior in zip(policy['folds'], expected['folds']):
                  for key in ('validation_start', 'validation_end', 'train', 'validation', 'coverage', 'baselines'):
                      assert fold[key] == prior[key], key
                  assert [(r['date_time'], r['actual']) for r in fold['predictions']] == [(r['date_time'], r['actual']) for r in prior['predictions']]
          # The evaluator enforces paired baseline identity. Unit tests recompute
          # residual metrics; floating-point predictions can differ by platform.
          PYCODE
